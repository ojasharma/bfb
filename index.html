<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Blue Flower Blooms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one centered column on a night-blue ground; cover art is the hero, three listen rows beneath. */
  :root {
    --bg: #05070d;
    --surface: #0b1020;
    --surface-hover: #111a33;
    --line: #1a2442;
    --fg: #e8edf8;
    --muted: #8591b0;
    --accent: #6f8fe0;
    --font-display: "Instrument Serif", "Times New Roman", serif;
    --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 40px 32px;
    background-image:
      radial-gradient(60rem 38rem at 50% -8%, rgba(54, 86, 175, 0.28), transparent 70%),
      radial-gradient(40rem 30rem at 50% 108%, rgba(30, 52, 120, 0.22), transparent 70%);
    background-repeat: no-repeat;
  }
  .wrap {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 28px;
  }
  .cover {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 100%;
  }
  .cover::before {
    content: "";
    position: absolute;
    inset: 6% 6% -4%;
    background: radial-gradient(closest-side, rgba(70, 110, 220, 0.5), transparent);
    filter: blur(28px);
    z-index: 0;
  }
  .cover img {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .head { display: flex; flex-direction: column; gap: 14px; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(111, 143, 224, 0.6);
    animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(111, 143, 224, 0.55); }
    70%, 100% { box-shadow: 0 0 0 10px rgba(111, 143, 224, 0); }
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 3.6rem);
    line-height: 0.98;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .artist { display: flex; align-items: center; gap: 12px; }
  .artist img {
    width: 36px; height: 36px; border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--line);
  }
  .artist span {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .artist small {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .links { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .links a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    min-height: 60px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--fg);
    text-decoration: none;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }
  .links a:hover { background: var(--surface-hover); border-color: #2b3c6e; }
  .links a:active { transform: scale(0.99); }
  .links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .links svg.logo { width: 28px; height: 28px; flex: none; }
  .links .name { flex: 1; min-width: 0; font-weight: 500; }
  .links .go {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: color 0.18s ease;
  }
  .links a:hover .go { color: var(--fg); }
  .links .go svg { width: 14px; height: 14px; transition: transform 0.18s ease; }
  .links a:hover .go svg { transform: translate(2px, -2px); }
  footer {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    padding-top: 8px;
  }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .links a, .links .go svg { transition: none; }
  }
  @media (min-width: 700px) {
    body { padding-block: 64px 48px; }
  }
</style>

<main class="wrap">
  <div class="cover">
    <img src="cover.jpg" width="1000" height="1000" alt="Blue Flower Blooms single cover: a deep blue lily wrapped in smoke on a black background">
  </div>

  <header class="head">
    <div class="status"><span class="dot" aria-hidden="true"></span>Out now</div>
    <h1>Blue Flower <em>Blooms</em></h1>
    <div class="artist">
      <img src="artist.jpg" width="240" height="240" alt="PETROLDIESEL">
      <div>
        <span>PETROLDIESEL</span><br>
        <small>New single</small>
      </div>
    </div>
  </header>

  <ul class="links">
    <li>
      <a href="https://open.spotify.com/track/1t38NTE4zCeAhN58Xy85Ek?si=f52903612fa346ac" target="_blank" rel="noopener">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="12" fill="#1DB954"/>
          <path d="M5.4 8.5c4.3-1.3 9.3-1 13.2 1.4" fill="none" stroke="#05070d" stroke-width="2" stroke-linecap="round"/>
          <path d="M6.2 12.1c3.7-1 7.8-.7 11.1 1.2" fill="none" stroke="#05070d" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M7 15.4c3-.8 6.2-.5 8.9 1" fill="none" stroke="#05070d" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span class="name">Spotify</span>
        <span class="go">Play <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 11L11 3M5 3h6v6"/></svg></span>
      </a>
    </li>
    <li>
      <a href="https://music.apple.com/in/album/blue-flower-blooms/6832025253?i=6832025254" target="_blank" rel="noopener">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="am" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FA5C70"/>
              <stop offset="1" stop-color="#FA233B"/>
            </linearGradient>
          </defs>
          <rect width="24" height="24" rx="5.5" fill="url(#am)"/>
          <path d="M9.4 17V7.2l7.4-1.6v9.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
          <ellipse cx="7.6" cy="17.2" rx="2.1" ry="1.8" fill="#fff"/>
          <ellipse cx="14.9" cy="15.6" rx="2.1" ry="1.8" fill="#fff"/>
        </svg>
        <span class="name">Apple Music</span>
        <span class="go">Play <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 11L11 3M5 3h6v6"/></svg></span>
      </a>
    </li>
    <li>
      <a href="https://youtu.be/ryX3yIaePlo?si=Z8Vp_tbMaWGT-hEG" target="_blank" rel="noopener">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="1" y="4.5" width="22" height="15" rx="4.5" fill="#FF0000"/>
          <path d="M10 8.6l5.4 3.4-5.4 3.4z" fill="#fff"/>
        </svg>
        <span class="name">YouTube</span>
        <span class="go">Watch <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 11L11 3M5 3h6v6"/></svg></span>
      </a>
    </li>
  </ul>

  <footer>&copy; 2026 PETROLDIESEL</footer>
</main>

</body></html>
